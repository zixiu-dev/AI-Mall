services:
  knowledge-postgres:
    image: pgvector/pgvector:0.8.2-pg17
    profiles: ["knowledge"]
    environment:
      POSTGRES_DB: bitmall_knowledge
      POSTGRES_USER: bitmall
      POSTGRES_PASSWORD: ${RAG_PG_PASSWORD:-}
    ports:
      - "127.0.0.1:${RAG_PG_PORT:-5433}:5432"
    volumes:
      - bit-mall-knowledge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  order-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - wowo-order-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    profiles: ["hotkey"]
    command:
      - /usr/local/bin/etcd
      - --name=wowo-local
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=wowo-local=http://etcd:2380
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - wowo-etcd:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  hotkey-worker:
    profiles: ["hotkey"]
    build:
      context: .
      dockerfile: deploy/hotkey/Dockerfile
    command:
      - --etcd.server=http://etcd:2379
      - --etcd.workerPath=wowo-mall
      # The application runs on the host, so advertise the host-mapped Netty endpoint.
      - --local.address=127.0.0.1
      - --server.port=18081
      - --thread.count=2
    ports:
      - "127.0.0.1:11111:11111"
      - "127.0.0.1:18081:18081"
    depends_on:
      etcd:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bit_mall
      MYSQL_USER: bitmall
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - bit-mall-mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--default-time-zone=+08:00"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin --user=$$MYSQL_USER ping --silent"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  bit-mall-knowledge-pg:
  wowo-order-redis:
  wowo-etcd:
  bit-mall-mysql:

