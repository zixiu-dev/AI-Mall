<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">接口全景 · 一次购买如何串起各功能</title><desc id="desc">按用户任务组织接口；同一套 Service 同时供页面与 Agent 工具使用</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7b8ba5" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}</style>
<rect x="0" y="0" width="1440" height="850" rx="0" fill="#fbfcff" stroke="none"/>
<text x="32" y="51" font-size="32" fill="#142b4b" style="fill:#142b4b" font-weight="600">接口全景 · 一次购买如何串起各功能</text>
<text x="34" y="88" font-size="19" fill="#586c88" style="fill:#586c88">按用户任务组织接口；同一套 Service 同时供页面与 Agent 工具使用</text>
<rect x="1246" y="28" width="160" height="35" rx="17" fill="#eaf1fb" stroke="none"/>
<text x="1326" y="51" font-size="16" fill="#365c8b" style="fill:#365c8b" font-weight="600" text-anchor="middle">智购 · 设计图</text>
<rect x="32" y="124" width="1376" height="160" rx="12" fill="#eff6ff" stroke="#b8d0ee"/>
<text x="52" y="158" font-size="23" fill="#2466b5" style="fill:#2466b5" font-weight="600">01  发现商品与准备购买</text>
<rect x="50" y="175" width="314" height="94" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="64" y="192" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="78" y="211" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">搜索与筛选</text>
<text x="67" y="244" font-size="19" fill="#43566f" style="fill:#43566f">GET /products</text>
<rect x="392" y="175" width="314" height="94" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="406" y="192" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="420" y="211" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">详情选规格</text>
<text x="409" y="244" font-size="19" fill="#43566f" style="fill:#43566f">GET /products/{id}</text>
<rect x="734" y="175" width="314" height="94" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="748" y="192" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="762" y="211" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">购物车 / 优惠券</text>
<text x="751" y="244" font-size="19" fill="#43566f" style="fill:#43566f">GET /cart · GET /coupons</text>
<rect x="1076" y="175" width="314" height="94" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="1090" y="192" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="1104" y="211" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">结算试算</text>
<text x="1093" y="244" font-size="19" fill="#43566f" style="fill:#43566f">POST /checkout/quote</text>
<path d="M364 222 L392 222" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M706 222 L734 222" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1048 222 L1076 222" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1233 284 L1233 318" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="32" y="318" width="1376" height="178" rx="12" fill="#fff7ed" stroke="#ebccaa"/>
<text x="52" y="352" font-size="23" fill="#b66824" style="fill:#b66824" font-weight="600">02  提交一次稳定的购买意图</text>
<rect x="50" y="369" width="440" height="112" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="64" y="386" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="78" y="405" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">后端发号</text>
<text x="67" y="438" font-size="19" fill="#43566f" style="fill:#43566f">POST /order-tokens</text>
<text x="67" y="466" font-size="19" fill="#43566f" style="fill:#43566f">只发 UUID，不创建任务</text>
<rect x="500" y="369" width="440" height="112" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="514" y="386" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="528" y="405" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">正式提交</text>
<text x="517" y="438" font-size="19" fill="#43566f" style="fill:#43566f">POST /orders/submit</text>
<text x="517" y="466" font-size="19" fill="#43566f" style="fill:#43566f">trace + 购买参数，绑定快照</text>
<rect x="950" y="369" width="440" height="112" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="964" y="386" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="978" y="405" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">后端执行</text>
<text x="967" y="438" font-size="19" fill="#43566f" style="fill:#43566f">SYNC 建单 / ASYNC 受理</text>
<text x="967" y="466" font-size="19" fill="#43566f" style="fill:#43566f">用户不能指定绕过业务校验</text>
<path d="M490 426 L500 426" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M940 426 L950 426" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1170 496 L1170 530" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="32" y="530" width="1376" height="178" rx="12" fill="#eef9f7" stroke="#b5ded5"/>
<text x="52" y="564" font-size="23" fill="#247d71" style="fill:#247d71" font-weight="600">03  查询结果与订单后续</text>
<rect x="50" y="581" width="440" height="112" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="64" y="598" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="78" y="617" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">原 trace 查询</text>
<text x="67" y="650" font-size="19" fill="#43566f" style="fill:#43566f">GET /order-traces/{id}</text>
<text x="67" y="678" font-size="19" fill="#43566f" style="fill:#43566f">PROCESSING / SUCCESS / 失败</text>
<rect x="500" y="581" width="440" height="112" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="514" y="598" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="528" y="617" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">查看当前订单</text>
<text x="517" y="650" font-size="19" fill="#43566f" style="fill:#43566f">GET /orders</text>
<text x="517" y="678" font-size="19" fill="#43566f" style="fill:#43566f">建单后是 PENDING_PAYMENT</text>
<rect x="950" y="581" width="440" height="112" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="964" y="598" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="978" y="617" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">关闭或模拟支付</text>
<text x="967" y="650" font-size="19" fill="#43566f" style="fill:#43566f">POST /orders/{id}/cancel</text>
<text x="967" y="678" font-size="19" fill="#43566f" style="fill:#43566f">demo-pay：显式启用的演示入口</text>
<path d="M490 638 L500 638" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M940 638 L950 638" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<text x="50" y="750" font-size="21" fill="#7151a6" style="fill:#7151a6" font-weight="600">Agent：chat / chat/stream → 查询工具；写工具 → 确认卡 → actions/{id}/confirm → 相同业务服务</text>
<path d="M32 786 L1408 786" fill="none" stroke="#7b8ba5" stroke-width="1.7"/>
<text x="34" y="821" font-size="18" fill="#687c96" style="fill:#687c96">图中商城路径省略 /api/store；物流、售后、知识还通过内部服务和 Agent 工具开放，不虚构 REST 接口。</text>
</svg>