<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">运行方式 · 先选数据环境，再选助手模式</title><desc id="desc">demo 与普通配置是运行环境；真实模型开关可叠加到对应环境上</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7b8ba5" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}</style>
<rect x="0" y="0" width="1440" height="920" rx="0" fill="#fbfcff" stroke="none"/>
<text x="32" y="51" font-size="32" fill="#142b4b" style="fill:#142b4b" font-weight="600">运行方式 · 先选数据环境，再选助手模式</text>
<text x="34" y="88" font-size="19" fill="#586c88" style="fill:#586c88">demo 与普通配置是运行环境；真实模型开关可叠加到对应环境上</text>
<rect x="1246" y="28" width="160" height="35" rx="17" fill="#eaf1fb" stroke="none"/>
<text x="1326" y="51" font-size="16" fill="#365c8b" style="fill:#365c8b" font-weight="600" text-anchor="middle">智购 · 设计图</text>
<rect x="32" y="132" width="668" height="388" rx="12" fill="#eff6ff" stroke="#b8d0ee"/>
<text x="52" y="166" font-size="23" fill="#2466b5" style="fill:#2466b5" font-weight="600">A  ·  demo：快速看业务闭环</text>
<rect x="52" y="190" width="628" height="128" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="66" y="207" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="80" y="226" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">Spring Boot + H2 内存数据库</text>
<text x="69" y="259" font-size="19" fill="#43566f" style="fill:#43566f">商品 / 购物车 / 券 / 同步建单 / 确认卡</text>
<text x="69" y="287" font-size="19" fill="#43566f" style="fill:#43566f">重启重置；关闭交易预扣和 MQ</text>
<text x="52" y="370" font-size="23" fill="#2466b5" style="fill:#2466b5" font-weight="600">默认确定性助手，不消耗模型调用。</text>
<text x="52" y="417" font-size="21" fill="#172b4d" style="fill:#172b4d">首次编译仍需要安装 HotKey 客户端依赖。</text>
<text x="52" y="465" font-size="21" fill="#172b4d" style="fill:#172b4d">缓存 Redis 未运行时走有界数据库回源。</text>
<rect x="724" y="132" width="684" height="388" rx="12" fill="#fff7ed" stroke="#ebccaa"/>
<text x="744" y="166" font-size="23" fill="#b66824" style="fill:#b66824" font-weight="600">B  ·  普通配置：真实组件联调</text>
<rect x="744" y="190" width="644" height="128" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="758" y="207" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="772" y="226" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">Spring Boot 模块化单体</text>
<text x="761" y="259" font-size="19" fill="#43566f" style="fill:#43566f">MySQL + 商品缓存 Redis + 交易 Redis</text>
<text x="761" y="287" font-size="19" fill="#43566f" style="fill:#43566f">SYNC / ASYNC / AUTO；MQ 单独准备</text>
<text x="744" y="370" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">商品缓存可淘汰；交易 Redis 为 noeviction。</text>
<text x="744" y="417" font-size="21" fill="#172b4d" style="fill:#172b4d">Compose 提供 MySQL、Redis、可选 HotKey。</text>
<text x="744" y="465" font-size="21" fill="#172b4d" style="fill:#172b4d">初始化后的库存池不能随意清空或关闭预扣。</text>
<path d="M366 520 L366 559" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1066 520 L1066 559" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="32" y="559" width="1376" height="149" rx="12" fill="#f6f3ff" stroke="#d4c4ef"/>
<text x="52" y="593" font-size="23" fill="#7151a6" style="fill:#7151a6" font-weight="600">C  ·  可选真实 Agent：在所选环境上启用模型</text>
<text x="53" y="636" font-size="21" fill="#172b4d" style="fill:#172b4d">AGENT_AI_ENABLED=true + 模型 API Key / Base URL / Model → Spring AI Agent → 真实业务工具</text>
<text x="53" y="680" font-size="20" fill="#7151a6" style="fill:#7151a6">失败明确报告；不偷偷切换 demo 冒充真实模型。商品缓存、订单幂等仍由原业务层处理。</text>
<rect x="32" y="743" width="1376" height="87" rx="12" fill="#eef9f7" stroke="#b5ded5"/>
<text x="52" y="777" font-size="23" fill="#247d71" style="fill:#247d71" font-weight="600">观察入口</text>
<text x="250" y="794" font-size="21" fill="#172b4d" style="fill:#172b4d">商城 :8080  ·  管理端 127.0.0.1:9080  ·  Agent status + 实际工具结果共同验证运行状态</text>
<path d="M32 856 L1408 856" fill="none" stroke="#7b8ba5" stroke-width="1.7"/>
<text x="34" y="891" font-size="18" fill="#687c96" style="fill:#687c96">环境变量需通过进程环境导入；.env.example 是变量清单。首次构建、端口和故障排查命令见正文。</text>
</svg>