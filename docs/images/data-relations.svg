<rect x="494" y="570" width="424" height="124" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="508" y="587" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="522" y="606" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">order_item</text>
<text x="511" y="639" font-size="19" fill="#43566f" style="fill:#43566f">关联 product / SKU</text>
<text x="511" y="667" font-size="19" fill="#43566f" style="fill:#43566f">保存名称、规格、成交单价与数量</text>
<path d="M494 634 L460 634 L460 460 L426 460" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
