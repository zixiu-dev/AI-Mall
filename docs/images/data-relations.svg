<rect x="986" y="198" width="402" height="115" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="1000" y="215" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="1014" y="234" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">pending_action</text>
<text x="1003" y="267" font-size="19" fill="#43566f" style="fill:#43566f">确认卡参数 / 摘要 / CAS</text>
<text x="1003" y="295" font-size="19" fill="#43566f" style="fill:#43566f">订单提议关联 trace</text>
<rect x="986" y="337" width="402" height="105" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="1000" y="354" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="1014" y="373" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">user_coupon</text>
