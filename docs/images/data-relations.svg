<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc"><title id="title">数据关系 · 购买意图、成交记录与恢复进度</title><desc id="desc">只画核心业务关联；箭头表达引用 / 业务联系，不全部代表数据库外键</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7b8ba5" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}</style>
<rect x="0" y="0" width="1440" height="970" rx="0" fill="#fbfcff" stroke="none"/>
<text x="32" y="51" font-size="32" fill="#142b4b" style="fill:#142b4b" font-weight="600">数据关系 · 购买意图、成交记录与恢复进度</text>
<text x="34" y="88" font-size="19" fill="#586c88" style="fill:#586c88">只画核心业务关联；箭头表达引用 / 业务联系，不全部代表数据库外键</text>
