<rect x="986" y="466" width="402" height="105" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="1000" y="483" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="1014" y="502" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">order_message_outbox</text>
<text x="1003" y="535" font-size="19" fill="#43566f" style="fill:#43566f">待发送命令 / 事件 / 租约</text>
<rect x="986" y="595" width="402" height="105" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="1000" y="612" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="1014" y="631" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">order_inventory_return</text>
<text x="1003" y="664" font-size="19" fill="#43566f" style="fill:#43566f">关单后的 Redis 返还进度</text>
<path d="M918 258 L986 258" fill="none" stroke="#7b8ba5" stroke-width="1.7" stroke-dasharray="5 5"/>
<rect x="32" y="779" width="1376" height="97" rx="12" fill="#f6f3ff" stroke="#d4c4ef"/>
<text x="52" y="813" font-size="23" fill="#7151a6" style="fill:#7151a6" font-weight="600">两个生命周期必须分开</text>
<text x="52" y="848" font-size="20" fill="#172b4d" style="fill:#172b4d">trace.SUCCESS：曾成功建单；订单可能后来取消。SUCCESS + CONFIRM_PENDING：成功但 Redis 确认待重试。</text>
<path d="M32 906 L1408 906" fill="none" stroke="#7b8ba5" stroke-width="1.7"/>
<text x="34" y="941" font-size="18" fill="#687c96" style="fill:#687c96">完整用户、购物车、会话、知识、售后表见正文；模型状态、页面消息和长期偏好因用途不同而分开保存。</text>
</svg>