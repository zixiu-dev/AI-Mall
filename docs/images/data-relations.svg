<text x="69" y="267" font-size="19" fill="#43566f" style="fill:#43566f">商品名称 / 品牌 / 描述</text>
<text x="69" y="295" font-size="19" fill="#43566f" style="fill:#43566f">product_attribute：材质、用途</text>
<path d="M239 322 L239 382" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="163.3" y="326.0" width="151.39999999999998" height="26" rx="3" fill="#fbfcff" stroke="none"/>
<text x="239.0" y="344.0" font-size="17" fill="#60728a" style="fill:#60728a" text-anchor="middle">一个商品多个 SKU</text>
<rect x="52" y="382" width="374" height="155" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="66" y="399" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="80" y="418" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">product_sku</text>
<text x="69" y="451" font-size="19" fill="#43566f" style="fill:#43566f">具体规格 / 单价 / stock</text>
<text x="69" y="479" font-size="19" fill="#43566f" style="fill:#43566f">locked_stock：待支付占用</text>
<text x="69" y="507" font-size="19" fill="#43566f" style="fill:#43566f">sku_attribute：颜色、尺码等</text>
<text x="52" y="612" font-size="18" fill="#52647e" style="fill:#52647e">历史订单保留名称 / 单价 / 地址快照</text>
<text x="52" y="652" font-size="19" fill="#52647e" style="fill:#52647e">商品变化不应改变过去的成交内容。</text>
