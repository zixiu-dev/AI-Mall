<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">15 分钟未支付 · MQ 定时检查与幂等关单</title><desc id="desc">从实际建单开始计时；消息只触发检查，数据库状态与期限决定是否关闭</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7b8ba5" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}</style>
<rect x="0" y="0" width="1440" height="920" rx="0" fill="#fbfcff" stroke="none"/>
<text x="32" y="51" font-size="32" fill="#142b4b" style="fill:#142b4b" font-weight="600">15 分钟未支付 · MQ 定时检查与幂等关单</text>
<text x="34" y="88" font-size="19" fill="#586c88" style="fill:#586c88">从实际建单开始计时；消息只触发检查，数据库状态与期限决定是否关闭</text>
<rect x="1246" y="28" width="160" height="35" rx="17" fill="#eaf1fb" stroke="none"/>
<text x="1326" y="51" font-size="16" fill="#365c8b" style="fill:#365c8b" font-weight="600" text-anchor="middle">智购 · 设计图</text>
<rect x="32" y="131" width="1376" height="172" rx="12" fill="#fff7ed" stroke="#ebccaa"/>
<text x="52" y="165" font-size="23" fill="#b66824" style="fill:#b66824" font-weight="600">① 建单事务：订单与定时命令一起提交</text>
<rect x="52" y="188" width="658" height="97" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="66" y="205" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="80" y="224" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">PENDING_PAYMENT + payment_expires_at</text>
<text x="69" y="257" font-size="19" fill="#43566f" style="fill:#43566f">默认建单时间 + 900 秒；已有订单沿用原期限</text>
<rect x="730" y="188" width="658" height="97" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="744" y="205" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="758" y="224" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">ORDER_PAYMENT_TIMEOUT Outbox</text>
<text x="747" y="257" font-size="19" fill="#43566f" style="fill:#43566f">固定 epoch 毫秒；发送重试不能重新加 15 分钟</text>
<path d="M1060 303 L1060 324 L252 324 L252 342" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="32" y="342" width="440" height="116" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="46" y="359" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="60" y="378" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">② 提交后可靠发送</text>
<text x="49" y="411" font-size="19" fill="#43566f" style="fill:#43566f">RocketMQ 5 绝对时刻投递</text>
<text x="49" y="439" font-size="19" fill="#43566f" style="fill:#43566f">已到期的积压命令立即补发</text>
<rect x="500" y="342" width="440" height="116" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="514" y="359" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="528" y="378" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">③ Broker 到期投递</text>
<text x="517" y="411" font-size="19" fill="#43566f" style="fill:#43566f">独立消费组 / 只订阅超时 Tag</text>
<text x="517" y="439" font-size="19" fill="#43566f" style="fill:#43566f">消息可重复、到达可能滞后</text>
<rect x="968" y="342" width="440" height="116" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="982" y="359" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="996" y="378" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">④ 订单事务重新检查</text>
<text x="985" y="411" font-size="19" fill="#43566f" style="fill:#43566f">锁订单 → 数据库状态与期限</text>
<text x="985" y="439" font-size="19" fill="#43566f" style="fill:#43566f">与支付 / 手动取消争同一把行锁</text>
<path d="M472 400 L500 400" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M940 400 L968 400" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1188 458 L1188 491 L270 491 L270 526" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1188 491 L728 491 L728 526" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1188 491 L1188 526" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="32" y="526" width="440" height="147" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="46" y="543" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="60" y="562" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">仍待支付且已到期</text>
<text x="49" y="595" font-size="19" fill="#43566f" style="fill:#43566f">CLOSED / 状态 CAS</text>
<text x="49" y="623" font-size="19" fill="#43566f" style="fill:#43566f">返可售库存、释放待支付占用和券</text>
<text x="49" y="651" font-size="19" fill="#43566f" style="fill:#43566f">持久化 Redis RETURN，提交后整理</text>
<rect x="500" y="526" width="440" height="147" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="514" y="543" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="528" y="562" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">已经支付或关闭</text>
<text x="517" y="595" font-size="19" fill="#43566f" style="fill:#43566f">不再变更订单</text>
<text x="517" y="623" font-size="19" fill="#43566f" style="fill:#43566f">不返还已支付购买的库存</text>
<text x="517" y="651" font-size="19" fill="#43566f" style="fill:#43566f">重复消息不会重复释放</text>
<rect x="968" y="526" width="440" height="147" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="982" y="543" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="996" y="562" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">仍待支付但未到期</text>
<text x="985" y="595" font-size="19" fill="#43566f" style="fill:#43566f">不相信消息里的时间</text>
<text x="985" y="623" font-size="19" fill="#43566f" style="fill:#43566f">抛异常重试，避免提前确认完成</text>
<text x="985" y="651" font-size="19" fill="#43566f" style="fill:#43566f">基础设施异常同样交给 MQ 重试</text>
<rect x="32" y="712" width="1376" height="111" rx="12" fill="#eef9f7" stroke="#b5ded5"/>
<text x="52" y="746" font-size="23" fill="#247d71" style="fill:#247d71" font-weight="600">⑤ 数据库到期扫描兜底</text>
<text x="52" y="789" font-size="21" fill="#172b4d" style="fill:#172b4d">MQ 关闭 / 发送积压 / 消费失败：扫描到期订单，进入相同关单事务；Redis 返还失败继续幂等恢复。</text>
<path d="M32 856 L1408 856" fill="none" stroke="#7b8ba5" stroke-width="1.7"/>
<text x="34" y="891" font-size="18" fill="#687c96" style="fill:#687c96">支付入口也会复核截止时间；不保证恰好第 900 秒处理完，保证未到期不因提前消息关闭、已支付不被误关。</text>
</svg>