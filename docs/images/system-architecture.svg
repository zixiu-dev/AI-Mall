<rect x="32" y="137" width="964" height="72" rx="12" fill="#edf8f3" stroke="#acd2c2"/>
<text x="49" y="168" font-size="22" font-weight="650" fill="#17614e">商城 Web 页面</text>
<text x="49" y="197" font-size="18" font-weight="400" fill="#39535e">商品浏览、购物车、结算与订单  ·  对话助手、流式回答与操作确认卡</text>
<rect x="54" y="283" width="293" height="74" rx="12" fill="#eef5ff" stroke="#bbcee9"/>
<text x="71" y="314" font-size="22" font-weight="650" fill="#245d98">商城 Controller</text>
<text x="71" y="343" font-size="18" font-weight="400" fill="#39535e">REST · /api/store/*</text>
<rect x="383" y="283" width="588" height="74" rx="12" fill="#f5f0ff" stroke="#d5c6ee"/>
<text x="400" y="314" font-size="22" font-weight="650" fill="#664991">Agent Controller</text>
<text x="400" y="343" font-size="18" font-weight="400" fill="#39535e">HTTP / SSE · 提交后台回答、订阅与重连</text>
<rect x="383" y="383" width="274" height="99" rx="12" fill="#f5f0ff" stroke="#d5c6ee"/>
<text x="400" y="414" font-size="22" font-weight="650" fill="#664991">Spring AI 编排</text>
<text x="400" y="443" font-size="18" font-weight="400" fill="#39535e">工具循环、上下文与 Skills</text>
<text x="400" y="468" font-size="18" font-weight="400" fill="#39535e">后台回答和 SSE 草稿</text>
<rect x="685" y="383" width="286" height="99" rx="12" fill="#f5f0ff" stroke="#d5c6ee"/>
<text x="702" y="414" font-size="22" font-weight="650" fill="#664991">模型网关</text>
<text x="702" y="443" font-size="18" font-weight="400" fill="#39535e">三态熔断、主备切换</text>
<text x="702" y="468" font-size="18" font-weight="400" fill="#39535e">调用耗时与 Token 指标</text>
<rect x="383" y="509" width="588" height="89" rx="12" fill="#fff5e9" stroke="#e7cba7"/>
<text x="400" y="540" font-size="22" font-weight="650" fill="#8d571f">受控工具与确认卡</text>
<text x="400" y="569" font-size="18" font-weight="400" fill="#39535e">查询直接调用；写操作先保存确认卡，用户批准后执行。</text>
<rect x="54" y="632" width="917" height="79" rx="12" fill="#edf8f3" stroke="#acd2c2"/>
<text x="71" y="663" font-size="22" font-weight="650" fill="#17614e">共用业务 Service</text>
<text x="71" y="692" font-size="18" font-weight="400" fill="#39535e">商品 · 购物车 · 优惠券 · 结算 · 订单 · 物流售后 · 知识检索</text>
<rect x="32" y="779" width="234" height="86" rx="12" fill="#f3f7f8" stroke="#cbd9df"/>
<text x="49" y="810" font-size="22" font-weight="650" fill="#405b68">MySQL</text>
<text x="49" y="839" font-size="18" font-weight="400" fill="#39535e">交易、会话与 Outbox</text>
<rect x="276" y="779" width="234" height="86" rx="12" fill="#f3f7f8" stroke="#cbd9df"/>
<text x="293" y="810" font-size="22" font-weight="650" fill="#405b68">Redis</text>
<text x="293" y="839" font-size="18" font-weight="400" fill="#39535e">展示缓存与交易预占</text>
<rect x="520" y="779" width="234" height="86" rx="12" fill="#f3f7f8" stroke="#cbd9df"/>
<text x="537" y="810" font-size="22" font-weight="650" fill="#405b68">RocketMQ</text>
<text x="537" y="839" font-size="18" font-weight="400" fill="#39535e">异步建单与延时关单</text>
<rect x="764" y="779" width="232" height="86" rx="12" fill="#f3f7f8" stroke="#cbd9df"/>
<text x="781" y="810" font-size="22" font-weight="650" fill="#405b68">PostgreSQL</text>
<text x="781" y="839" font-size="18" font-weight="400" fill="#39535e">pgvector 知识向量索引</text>
<rect x="1019" y="137" width="389" height="321" rx="14" fill="#ffffff" stroke="#d5c6ee"/>
<text x="1039" y="171" font-size="23" font-weight="650" fill="#664991">外部模型服务</text>
<rect x="1039" y="188" width="349" height="76" rx="12" fill="#f5f0ff" stroke="#d5c6ee"/>
<text x="1056" y="219" font-size="22" font-weight="650" fill="#664991">主模型</text>
<text x="1056" y="248" font-size="18" font-weight="400" fill="#39535e">使用现有 OpenAI 兼容配置</text>
<rect x="1039" y="278" width="349" height="76" rx="12" fill="#f5f0ff" stroke="#d5c6ee"/>
<text x="1056" y="309" font-size="22" font-weight="650" fill="#664991">备用模型</text>
<text x="1056" y="338" font-size="18" font-weight="400" fill="#39535e">阿里云百炼 · qwen-plus（可选）</text>
<text x="1041" y="385" font-size="18" font-weight="650" fill="#664991">模型候选各自计数</text>
<text x="1041" y="414" font-size="18" font-weight="400" fill="#39535e">默认连续 2 次故障 → 冷却 30 秒</text>
<text x="1041" y="441" font-size="18" font-weight="400" fill="#39535e">冷却结束 → 放 1 个请求探测</text>
<rect x="1019" y="483" width="389" height="382" rx="14" fill="#ffffff" stroke="#cbd9df"/>
<text x="1039" y="519" font-size="23" font-weight="650" fill="#405b68">商城关键链路</text>
<rect x="1039" y="537" width="349" height="89" rx="12" fill="#eef5ff" stroke="#bbcee9"/>
<text x="1056" y="568" font-size="22" font-weight="650" fill="#245d98">商品详情</text>
<text x="1056" y="597" font-size="18" font-weight="400" fill="#39535e">Caffeine → Bloom → Redis</text>
<text x="1056" y="622" font-size="18" font-weight="400" fill="#39535e">加锁双检后读数据库并回填</text>
<rect x="1039" y="642" width="349" height="72" rx="12" fill="#fff5e9" stroke="#e7cba7"/>
<text x="1056" y="673" font-size="22" font-weight="650" fill="#8d571f">同步下单</text>
<text x="1056" y="702" font-size="18" font-weight="400" fill="#39535e">预占库存 → 请求内提交建单事务</text>
<rect x="1039" y="730" width="349" height="101" rx="12" fill="#edf8f3" stroke="#acd2c2"/>
<text x="1056" y="761" font-size="22" font-weight="650" fill="#17614e">异步下单</text>
<text x="1056" y="790" font-size="18" font-weight="400" fill="#39535e">预扣 → 受理与 Outbox → MQ</text>
<text x="1056" y="815" font-size="18" font-weight="400" fill="#39535e">消费建单后通过原 trace 查询</text>
<text x="36" y="900" font-size="18" font-weight="400" fill="#516a73">同步与异步复用建单事务。受理、建单成功和支付成功分别保存状态。</text>
</svg>
