<text x="145" y="1194" font-size="19" style="fill:#52647e">模块化单体；演示身份 / 模拟支付；PG 向量检索；AUTO 为采样切换，HotKey 不决定下单模式。</text>
<text x="32" y="1230" font-size="18" style="fill:#718198">普通配置启用预扣时，同步与异步共用 Redis 库存池；离线 demo 关闭预扣。图示为职责视图，事务细节见「下单设计」。</text>
