<path d="M657 431 L685 431" fill="none" stroke="#6c8290" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M519 482 L519 509" fill="none" stroke="#6c8290" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M519 598 L519 632" fill="none" stroke="#6c8290" stroke-width="1.8" marker-end="url(#arrow)"/>
