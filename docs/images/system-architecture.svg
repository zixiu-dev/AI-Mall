<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="924" viewBox="0 0 1440 924" role="img" aria-labelledby="title desc">
<title id="title">AI - Mall 智能商城整体架构</title>
<desc id="desc">商城页面和 Agent 通过各自的 HTTP 接口调用共享业务服务。Agent 通过模型网关调用主模型与可选百炼备用模型。展示商品缓存、同步和异步下单、MySQL、Redis、RocketMQ 和 pgvector。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6c8290" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="0" y="0" width="1440" height="924" rx="0" fill="#f7fafb" stroke="none"/>
<rect x="32" y="27" width="1376" height="84" rx="16" fill="#123e35" stroke="none"/>
<text x="55" y="64" font-size="32" font-weight="700" fill="#ffffff">AI - Mall  智能商城架构</text>
<text x="57" y="91" font-size="18" font-weight="500" fill="#d0e7de">Spring Boot 模块化单体 · Web 页面与 Agent 共用业务服务</text>
<text x="1206" y="75" font-size="18" font-weight="600" fill="#d0e7de">Java 17 / Spring AI</text>
<rect x="32" y="241" width="964" height="484" rx="16" fill="#ffffff" stroke="#bdcdd2" stroke-dasharray="6 5"/>
<text x="760" y="267" font-size="18" font-weight="600" fill="#516a73">商城应用  /  单进程部署</text>
