<rect x="52" y="970" width="430" height="155" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="66" y="987" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="80" y="1006" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">⑦ 交还证据与缺口</text>
<text x="69" y="1039" font-size="19" fill="#43566f" style="fill:#43566f">groups / hits / coverage / warnings</text>
<text x="69" y="1067" font-size="19" fill="#43566f" style="fill:#43566f">来源、渠道、版本及真实检索模式</text>
<text x="69" y="1095" font-size="19" fill="#43566f" style="fill:#43566f">单路失败明确降级；两路失败 ERROR</text>
<rect x="530" y="970" width="406" height="155" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="544" y="987" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="558" y="1006" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">⑧ 回到外层工具循环</text>
<text x="547" y="1039" font-size="19" fill="#43566f" style="fill:#43566f">模型引用资料，可继续查订单</text>
<text x="547" y="1067" font-size="19" fill="#43566f" style="fill:#43566f">业务事实仍由业务工具返回</text>
<text x="547" y="1095" font-size="19" fill="#43566f" style="fill:#43566f">最后回答或按原规则请求确认</text>
<rect x="984" y="970" width="404" height="155" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="998" y="987" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="1012" y="1006" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">只读与执行边界</text>
<text x="1001" y="1039" font-size="19" fill="#43566f" style="fill:#43566f">政策不等于售后资格或交易授权</text>
<text x="1001" y="1067" font-size="19" fill="#43566f" style="fill:#43566f">正文不是系统 / 工具指令</text>
<text x="1001" y="1095" font-size="19" fill="#43566f" style="fill:#43566f">FOUND 不等于下单 / 退款成功</text>
<path d="M482 1046 L530 1046" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<text x="52" y="1170" font-size="20" fill="#b35249" style="fill:#b35249" font-weight="600">内容状态：FOUND / PARTIAL / NO_MATCH / CLARIFICATION_REQUIRED；基础设施错误不能伪装成无资料。</text>
<path d="M32 1196 L1408 1196" fill="none" stroke="#7b8ba5" stroke-width="1.7"/>
<text x="34" y="1231" font-size="18" fill="#687c96" style="fill:#687c96">向量排序在 PG 执行；HNSW 使用取决于查询计划；LIKE 不是 BM25，未接 cross-encoder。</text>
