<text x="1083" y="246" font-size="19" fill="#43566f" style="fill:#43566f">vector(1024) / JSONB / 指针</text>
<text x="1083" y="274" font-size="19" fill="#43566f" style="fill:#43566f">源未变 → PG 事务切换指针</text>
