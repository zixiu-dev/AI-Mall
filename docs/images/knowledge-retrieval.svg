<text x="32" y="51" font-size="32" fill="#142b4b" style="fill:#142b4b" font-weight="600">Agentic RAG · 从子问题到可核对证据</text>
<text x="34" y="88" font-size="19" fill="#586c88" style="fill:#586c88">同一个 ReAct 选择工具；搜索内部固定流水线；KEYWORD 默认启用，HYBRID 已完成百炼 / DeepSeek 真实联调</text>
