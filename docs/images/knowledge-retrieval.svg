<text x="52" y="158" font-size="23" fill="#466484" style="fill:#466484" font-weight="600">离线索引 · 不在用户聊天中构建，不在数据库事务中等模型</text>
<rect x="52" y="177" width="320" height="118" rx="12" fill="#ffffff" stroke="#c8d5e5"/>
<rect x="66" y="194" width="4" height="23" rx="2" fill="#466484" stroke="none"/>
<text x="80" y="213" font-size="22" fill="#466484" style="fill:#466484" font-weight="600">原文与源数据</text>
<text x="69" y="246" font-size="19" fill="#43566f" style="fill:#43566f">Markdown / manifest → 新迁移</text>
<text x="69" y="274" font-size="19" fill="#43566f" style="fill:#43566f">knowledge_document：22 篇</text>
<rect x="390" y="177" width="320" height="118" rx="12" fill="#ffffff" stroke="#c8d5e5"/>
<rect x="404" y="194" width="4" height="23" rx="2" fill="#466484" stroke="none"/>
<text x="418" y="213" font-size="22" fill="#466484" style="fill:#466484" font-weight="600">候选版本 BUILDING</text>
<text x="407" y="246" font-size="19" fill="#43566f" style="fill:#43566f">元数据 / 文本哈希校验</text>
<text x="407" y="274" font-size="19" fill="#43566f" style="fill:#43566f">短政策整篇，长文按段落</text>
<rect x="728" y="177" width="320" height="118" rx="12" fill="#ffffff" stroke="#c8d5e5"/>
<rect x="742" y="194" width="4" height="23" rx="2" fill="#466484" stroke="none"/>
<text x="756" y="213" font-size="22" fill="#466484" style="fill:#466484" font-weight="600">真实 embedding</text>
<text x="745" y="246" font-size="19" fill="#43566f" style="fill:#43566f">独立百炼地址 / 模型 / Key</text>
<text x="745" y="274" font-size="19" fill="#43566f" style="fill:#43566f">网络调用在事务外完成</text>
<rect x="1066" y="177" width="320" height="118" rx="12" fill="#ffffff" stroke="#c8d5e5"/>
<rect x="1080" y="194" width="4" height="23" rx="2" fill="#466484" stroke="none"/>
