<text x="547" y="714" font-size="19" fill="#43566f" style="fill:#43566f">SQL LIKE；不是 BM25</text>
<rect x="530" y="766" width="406" height="111" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="544" y="783" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="558" y="802" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">⑤ VECTOR</text>
<text x="547" y="835" font-size="19" fill="#43566f" style="fill:#43566f">PostgreSQL + pgvector</text>
<text x="547" y="863" font-size="19" fill="#43566f" style="fill:#43566f">精确 / HNSW（不足精确兜底）</text>
<rect x="52" y="645" width="430" height="232" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="66" y="662" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="80" y="681" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">⑥ 融合与完整证据预算</text>
<text x="69" y="714" font-size="19" fill="#43566f" style="fill:#43566f">RRF：Σ 1 / (60 + rank)，rank ≥ 1</text>
<text x="69" y="742" font-size="19" fill="#43566f" style="fill:#43566f">按文档 / 版本 / 块去重</text>
<text x="69" y="770" font-size="19" fill="#43566f" style="fill:#43566f">每组最多 2 条，总计最多 6 条</text>
<text x="69" y="798" font-size="19" fill="#43566f" style="fill:#43566f">工具另受 4000 字符预算限制</text>
<text x="69" y="826" font-size="19" fill="#43566f" style="fill:#43566f">移除整块，同步更新覆盖缺口</text>
<text x="69" y="854" font-size="19" fill="#43566f" style="fill:#43566f">范围不因相关性分数而放宽</text>
