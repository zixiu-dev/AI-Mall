<path d="M1157 539 L1157 645" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="32" y="590" width="1376" height="327" rx="12" fill="#eff6ff" stroke="#b8d0ee"/>
<text x="52" y="624" font-size="23" fill="#2466b5" style="fill:#2466b5" font-weight="600">知识服务内部 · 有界只读并行，同一发布版本与同一硬过滤范围</text>
<rect x="982" y="645" width="406" height="195" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="996" y="662" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="1010" y="681" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">④ 可选查询增强</text>
<text x="999" y="714" font-size="19" fill="#43566f" style="fill:#43566f">默认 DIRECT，不额外调用模型</text>
<text x="999" y="742" font-size="19" fill="#43566f" style="fill:#43566f">开启后：本次最多 1 个批量请求</text>
<text x="999" y="770" font-size="19" fill="#43566f" style="fill:#43566f">原查询 + 最多 2 个表达变体</text>
<text x="999" y="798" font-size="19" fill="#43566f" style="fill:#43566f">越界 / 超时 → 原查询并警告</text>
<text x="999" y="826" font-size="19" fill="#43566f" style="fill:#43566f">同轮缓存，换问题允许新增强</text>
<rect x="530" y="645" width="406" height="90" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="544" y="662" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
