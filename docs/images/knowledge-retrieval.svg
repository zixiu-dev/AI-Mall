<rect x="32" y="346" width="1376" height="220" rx="12" fill="#f6f3ff" stroke="#d4c4ef"/>
<text x="52" y="380" font-size="23" fill="#7151a6" style="fill:#7151a6" font-weight="600">外层 Spring AI · 理解完整请求，组织工具调用，不增加固定 Planner</text>
<rect x="52" y="401" width="320" height="138" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="66" y="418" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="80" y="437" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">① 可信本轮上下文</text>
<text x="69" y="470" font-size="19" fill="#43566f" style="fill:#43566f">用户原文 / 有限消息 / 期限</text>
<text x="69" y="498" font-size="19" fill="#43566f" style="fill:#43566f">保留身份与交易确认门禁</text>
<text x="69" y="526" font-size="19" fill="#43566f" style="fill:#43566f">例：Apple 退货 + Nike 配送</text>
<rect x="434" y="401" width="430" height="138" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="448" y="418" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="462" y="437" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">② 同一个 ReAct 选择工具</text>
<text x="451" y="470" font-size="19" fill="#43566f" style="fill:#43566f">search_knowledge(query, queries)</text>
<text x="451" y="498" font-size="19" fill="#43566f" style="fill:#43566f">queries 只放 1～3 个知识子问题</text>
<text x="451" y="526" font-size="19" fill="#43566f" style="fill:#43566f">商品 / 订单 / 结算继续用原工具</text>
<rect x="926" y="401" width="462" height="138" rx="12" fill="#ffffff" stroke="#b8d0ee"/>
<rect x="940" y="418" width="4" height="23" rx="2" fill="#2466b5" stroke="none"/>
<text x="954" y="437" font-size="22" fill="#2466b5" style="fill:#2466b5" font-weight="600">③ 工具参数与原意校验</text>
<text x="943" y="470" font-size="19" fill="#43566f" style="fill:#43566f">递归数组校验 / 去重 / 互斥参数</text>
<text x="943" y="498" font-size="19" fill="#43566f" style="fill:#43566f">iPhone → APPLE；未知品牌不删掉</text>
<text x="943" y="526" font-size="19" fill="#43566f" style="fill:#43566f">按主体与类别配对，歧义则补问</text>
<path d="M372 468 L434 468" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
