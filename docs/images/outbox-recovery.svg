<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc"><title id="title">可靠异步 · 业务状态、消息与恢复依据</title><desc id="desc">业务事实与发送意图同事务；至少一次投递，消费者必须幂等</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7b8ba5" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}</style>
<rect x="0" y="0" width="1440" height="950" rx="0" fill="#fbfcff" stroke="none"/>
<text x="32" y="51" font-size="32" fill="#142b4b" style="fill:#142b4b" font-weight="600">可靠异步 · 业务状态、消息与恢复依据</text>
<text x="34" y="88" font-size="19" fill="#586c88" style="fill:#586c88">业务事实与发送意图同事务；至少一次投递，消费者必须幂等</text>
<rect x="1246" y="28" width="160" height="35" rx="17" fill="#eaf1fb" stroke="none"/>
<text x="1326" y="51" font-size="16" fill="#365c8b" style="fill:#365c8b" font-weight="600" text-anchor="middle">智购 · 设计图</text>
<rect x="32" y="130" width="1376" height="162" rx="12" fill="#fff7ed" stroke="#ebccaa"/>
<text x="52" y="164" font-size="23" fill="#b66824" style="fill:#b66824" font-weight="600">① 异步受理事务：以下内容一起提交</text>
<rect x="52" y="185" width="658" height="89" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="66" y="202" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="80" y="221" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">trace：PROCESSING</text>
<text x="69" y="254" font-size="19" fill="#43566f" style="fill:#43566f">受理结果 + RESERVED + 处理期限</text>
<rect x="730" y="185" width="658" height="89" rx="12" fill="#ffffff" stroke="#ebccaa"/>
<rect x="744" y="202" width="4" height="23" rx="2" fill="#b66824" stroke="none"/>
<text x="758" y="221" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">Outbox：ORDER_BUILD</text>
<text x="747" y="254" font-size="19" fill="#43566f" style="fill:#43566f">稳定 eventId；消息只传 traceId</text>
<text x="52" y="329" font-size="22" fill="#b66824" style="fill:#b66824" font-weight="600">COMMIT 后可返回“已受理”；发送失败不丢发送意图，后台仍可扫描。</text>
<rect x="32" y="366" width="440" height="124" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="46" y="383" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="60" y="402" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">② Outbox 转发</text>
<text x="49" y="435" font-size="19" fill="#43566f" style="fill:#43566f">租约抢占 → 发送</text>
<text x="49" y="463" font-size="19" fill="#43566f" style="fill:#43566f">成功标 SENT / 失败重试</text>
<rect x="500" y="366" width="440" height="124" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="514" y="383" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="528" y="402" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">③ RocketMQ</text>
<text x="517" y="435" font-size="19" fill="#43566f" style="fill:#43566f">可重复投递</text>
<text x="517" y="463" font-size="19" fill="#43566f" style="fill:#43566f">建单消费组独立</text>
<rect x="968" y="366" width="440" height="124" rx="12" fill="#ffffff" stroke="#d4c4ef"/>
<rect x="982" y="383" width="4" height="23" rx="2" fill="#7151a6" stroke="none"/>
<text x="996" y="402" font-size="22" fill="#7151a6" style="fill:#7151a6" font-weight="600">④ 建单消费者</text>
<text x="985" y="435" font-size="19" fill="#43566f" style="fill:#43566f">消费幂等 → 读取后端快照</text>
<text x="985" y="463" font-size="19" fill="#43566f" style="fill:#43566f">共用建单事务 → SUCCESS</text>
<path d="M472 428 L500 428" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M940 428 L968 428" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M1188 490 L1188 530" fill="none" stroke="#7b8ba5" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="32" y="530" width="1376" height="304" rx="12" fill="#eef9f7" stroke="#b5ded5"/>
<text x="52" y="564" font-size="23" fill="#247d71" style="fill:#247d71" font-weight="600">⑤ 持久化进度支持幂等恢复</text>
<rect x="52" y="585" width="658" height="102" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="66" y="602" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="80" y="621" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">Lua 前 / 部分预扣后中断</text>
<text x="69" y="654" font-size="19" fill="#43566f" style="fill:#43566f">RESERVING + 快照 → 逐 SKU 释放</text>
<rect x="730" y="585" width="658" height="102" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="744" y="602" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="758" y="621" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">受理提交但消息未发送</text>
<text x="747" y="654" font-size="19" fill="#43566f" style="fill:#43566f">Outbox → 原 eventId 重发</text>
<rect x="52" y="705" width="658" height="102" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="66" y="722" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="80" y="741" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">建单提交但 Redis 未确认</text>
<text x="69" y="774" font-size="19" fill="#43566f" style="fill:#43566f">SUCCESS / CONFIRM_PENDING → 只补确认</text>
<rect x="730" y="705" width="658" height="102" rx="12" fill="#ffffff" stroke="#b5ded5"/>
<rect x="744" y="722" width="4" height="23" rx="2" fill="#247d71" stroke="none"/>
<text x="758" y="741" font-size="22" fill="#247d71" style="fill:#247d71" font-weight="600">关单提交但 Redis 未返还</text>
<text x="747" y="774" font-size="19" fill="#43566f" style="fill:#43566f">order_inventory_return → 幂等 RETURN</text>
<text x="53" y="876" font-size="23" fill="#7151a6" style="fill:#7151a6" font-weight="600">Outbox.SENT ≠ 建单成功；事件审计回执 ≠ 真实履约；trace.SUCCESS ≠ 已支付。</text>
<path d="M32 886 L1408 886" fill="none" stroke="#7b8ba5" stroke-width="1.7"/>
<text x="34" y="921" font-size="18" fill="#687c96" style="fill:#687c96">Broker 已收到、本地未记 SENT 时会重发；当前扫描和整理能力有限，需要同时关注后置积压及最老任务。</text>
</svg>